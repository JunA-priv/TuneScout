version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: music
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    # Load app settings from .env and service-specific overrides
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://user:pass@db:5432/music
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    # Production-like run on Windows Docker Desktop uses the image CMD

volumes:
  postgres_data:
