<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneScout - 認証</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
        .auth-container {
            background: linear-gradient(180deg, var(--glass-strong), rgba(255,255,255,.06));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.16);
            box-shadow: 0 20px 40px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 24px;
        }
        .auth-logo { text-align: center; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2);
            background: rgba(255,255,255,.08); color: var(--text);
        }
        .tabs { display: flex; margin-bottom: 14px; gap: 8px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: var(--glass); cursor: pointer; border: none; border-radius: 10px; color: var(--text); }
        .tab.active { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #0b1020; font-weight: 700; }
        .form-container { display: none; }
        .form-container.active { display: block; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #0b1020; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; margin-bottom: 10px; font-weight: 700; }
        button:hover { filter: brightness(1.02); }
    </style>
    <style>
      .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px}
      .brand{display:flex;align-items:center;gap:10px;font-weight:700}
      .brand img{width:24px;height:24px}
      .icon-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:var(--glass);color:var(--text);cursor:pointer}
      .auth-container{background:linear-gradient(180deg,var(--glass-strong),rgba(255,255,255,.06));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12)}
      .tab.active{background:linear-gradient(135deg,var(--brand-1),var(--brand-2))}
      button{background:linear-gradient(135deg,var(--brand-1),var(--brand-2))}
    </style>
</head>
<body>
  <main class="shell">
    <div class="topbar panel">
      <div class="brand">
        <img src="/static/logo.svg" alt="" onerror="this.style.display='none'"/>
        <span>🎵 TuneScout</span>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-pressed="false"><span aria-hidden="true">🌗</span><span class="label">ダーク</span></button>
    </div>
    <div class="auth-container">
        <div class="auth-logo">
            <h1>🎵 TuneScout</h1>
            <p class="jp-keep">音楽発掘レコメンドシステム</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showForm('login')">ログイン</button>
            <button class="tab" onclick="showForm('register')">新規登録</button>
        </div>

        <div id="login-form" class="form-container active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">メールアドレス</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">パスワード</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit">ログイン</button>
                <button type="button" onclick="resendConfirmation()" style="background: #28a745; margin-top: 10px;">確認メール再送信</button>
            </form>
        </div>

        <div id="register-form" class="form-container">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="register-email">メールアドレス</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">パスワード</label>
                    <input type="password" id="register-password" required>
                </div>
                <button type="submit">新規登録</button>
            </form>
        </div>
    </div>
  </main>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        let supabaseClient;
        
        // Supabase初期化を非同期で実行
        document.addEventListener('DOMContentLoaded', function() {
            const { createClient } = supabase;
            
            try {
                supabaseClient = createClient(
                    '{{ supabase_url }}',
                    '{{ supabase_key }}'
                );
                console.log('Supabaseクライアント初期化成功');
            } catch (error) {
                console.error('Supabase初期化エラー:', error);
                document.getElementById('register-form').innerHTML = '<p>認証サービスが利用できません</p>';
                document.getElementById('login-form').innerHTML = '<p>認証サービスが利用できません</p>';
            }
        });

        function showForm(type) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(type + '-form').classList.add('active');
        }

        async function resendConfirmation() {
            if (!supabaseClient) {
                alert('認証サービスが初期化されていません');
                return;
            }
            
            const email = document.getElementById('login-email').value;
            if (!email) {
                alert('メールアドレスを入力してください');
                return;
            }
            
            try {
                const { error } = await supabaseClient.auth.resend({
                    type: 'signup',
                    email: email
                });
                
                if (error) throw error;
                
                alert('確認メールを再送信しました。メールボックスをチェックしてください。');
            } catch (error) {
                console.error('Resend error:', error);
                alert('再送信エラー: ' + error.message);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            if (!supabaseClient) {
                alert('認証サービスが初期化されていません');
                return;
            }
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    if (error.message.includes('Email not confirmed')) {
                        alert('メールアドレスが確認されていません。確認メールをチェックするか、管理者にお問い合わせください。');
                        return;
                    }
                    throw error;
                }
                
                alert('ログインしました！');
                window.location.href = '/dashboard';
            } catch (error) {
                console.error('Login error:', error);
                alert('ログインエラー: ' + error.message);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            
            if (!supabaseClient) {
                alert('認証サービスが初期化されていません');
                return;
            }
            
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            console.log('Attempting registration with:', { email, password: '***' });

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                console.log('Registration response:', { data, error });

                if (error) throw error;
                
                // ユーザー登録成功時にプロフィール作成
                if (data.user) {
                    try {
                        const profileResponse = await fetch('/auth/create-profile', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                user_id: data.user.id,
                                email: data.user.email
                            })
                        });
                        
                        if (!profileResponse.ok) {
                            console.warn('プロフィール作成に失敗しました');
                        }
                    } catch (profileError) {
                        console.warn('プロフィール作成エラー:', profileError);
                    }
                }
                
                if (data.user && !data.user.email_confirmed_at) {
                    alert('登録しました！確認メールをチェックしてください。\n\n開発環境の場合、Supabase Dashboardで手動確認が必要な場合があります。');
                } else {
                    alert('登録が完了しました！');
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('登録エラー: ' + error.message);
            }
        }

        // 認証状態の監視をDOMContentLoaded内で実行
        document.addEventListener('DOMContentLoaded', function() {
            if (supabaseClient) {
                supabaseClient.auth.onAuthStateChange(async (event, session) => {
                    if (event === 'SIGNED_IN' && session) {
                        console.log('User signed in:', session.user);
                        
                        // ログイン時にプロフィールが存在しない場合作成
                        try {
                            await fetch('/auth/create-profile', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    user_id: session.user.id,
                                    email: session.user.email
                                })
                            });
                        } catch (error) {
                            console.warn('プロフィール作成エラー:', error);
                        }
                        
                        window.location.href = '/dashboard';
                    }
                });
            }
        });
    </script>
    <script>
      (function(){
        const KEY='ts-theme';
        function apply(t){
          document.documentElement.setAttribute('data-theme',t);
          const b=document.getElementById('theme-toggle');
          if(b){const d=t==='dark';b.setAttribute('aria-pressed',String(d));const l=b.querySelector('.label');if(l)l.textContent=d?'ライト':'ダーク';}
        }
        const saved=localStorage.getItem(KEY);
        const prefers=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
        apply(saved||(prefers?'dark':'light'));
        document.addEventListener('DOMContentLoaded',()=>{
          const b=document.getElementById('theme-toggle');
          if(!b) return;
          b.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||'light';const nxt=cur==='dark'?'light':'dark';localStorage.setItem(KEY,nxt);apply(nxt);});
        });
      })();
    </script>
</body>
</html>
